# ============================================================
# 技术蒸馏课程 —— 站点配置
#
# ★ 为什么是 docs_dir: docs 而不是 .（mkdocs 1.6 的硬性要求）★
#   mkdocs 明确拒绝两种布局：
#     - docs_dir 是配置文件所在目录的**父目录**
#     - site_dir 在 docs_dir **里面**（会自己 copy 自己）
#   所以站点源必须是配置文件的**子目录**。
#
#   于是：`sync_docs.py` 把课程内容同步到 `docs/`，
#   `make_site_nav.py` 再从 `docs/` 生成 nav —— 两步都只认 docs/，
#   保证"发布的东西"和"导航列的东西"永远是同一份。
#
#   源目录（01_.. 99_..）原样不动，所有 `技术蒸馏课程\99_工具与模板\...`
#   这类路径引用**不会断**。代价是有一份纯文本副本（几十 KB）。
#
# ★ 质量闸：`mkdocs build --strict`
#   链接坏了、nav 指向不存在的文件、警告 —— 一律直接失败。
#   这是"能编译通过"那条纪律在文档上的对应物。
#
# nav 段由 `99_工具与模板/make_site_nav.py --write` 生成，别手改。
# ============================================================

site_name: 技术蒸馏课程
site_description: C 语言与嵌入式 —— 从原始材料蒸馏成可执行的学习包
site_author: hhwang88592560-brono

docs_dir: docs
site_dir: _site

# ---------- 排除：docs/ 之内还要再挡一次的 ----------
# （第一道防线在 sync_docs.py；这里是第二道，防止手工往 docs/ 里丢东西）
exclude_docs: |
  **/__pycache__/**
  **/verification/**
  **/学习周记/**
  **/*.meta.json
  **/*.exe
  **/*.pyc
  .git/**
  .github/**

# ---------- 主题 ----------
theme:
  name: material
  language: zh
  features:
    - navigation.instant        # 左侧切换不整页刷新
    - navigation.tracking       # URL 跟着滚动走
    - navigation.top
    - content.code.copy         # 代码块右上角一键复制
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切到暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切到亮色
  icon:
    repo: fontawesome/brands/github

# ---------- Markdown 扩展 ----------
markdown_extensions:
  - admonition          # !!! note / warning
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # ★ mermaid 图：默认 superfences 会把它当普通代码块，
  #   要渲染成图必须注册 custom_fence
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# ---------- 附加 ----------
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hhwang88592560-brono
      name: GitHub

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/javascripts/mermaid.js

